name: Atualizar métricas

on:
  schedule:
    - cron: "17 11 * * 1"   # toda segunda, 8h17 de Brasília
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Atualizar números
        env:
          IG_COOKIES_TXT: ${{ secrets.IG_COOKIES }}
        run: |
          if [ -n "$IG_COOKIES_TXT" ]; then
            printf '%s\n' "$IG_COOKIES_TXT" > cookies.txt
            export IG_COOKIES=cookies.txt
          fi
          python scripts/update_metrics.py
          rm -f cookies.txt
      - name: Commit se mudou
        run: |
          git config user.name "metrics-bot"
          git config user.email "metrics-bot@users.noreply.github.com"
          git add data/videos.json
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Atualiza métricas dos vídeos"
            git push
          fi
